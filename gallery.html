<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styling Galeri 3 Foto Tema Maroon & Putih */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .gallery-item {
            background-color: #ffffff;
            border: 2px solid #800000; /* Bingkai Maroon */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px); /* Efek naik sedikit saat kursor mengarah ke foto */
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Mencegah gambar tertarik atau gepeng */
            display: block;
        }

        .gallery-caption {
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #800000;
            background-color: #ffffff;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="profil.html">Profil</a>
            <a href="about.html">About</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="kontak.html">Kontak</a>
        </nav>
    </header>

    <div class="container">
        <h1>Galeri Foto</h1>
        <p>Berikut adalah koleksi foto kegiatan saya:</p>
        
        <div class="gallery-grid">
            <!-- FOTO 1 -->
            <div class="gallery-item">
                <img src="foto1.jpg" alt="Foto saya">
                <div class="gallery-caption">good vibes</div>
            </div>

            <!-- FOTO 2 -->
            <div class="gallery-item">
                <img src="foto2.jpg" alt="Foto running">
                <div class="gallery-caption">Running</div>
            </div>

            <!-- FOTO 3 -->
            <div class="gallery-item">
                <img src="foto3.jpg" alt="Foto di lapangan">
                <div class="gallery-caption">Foto di Lapangan</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Website Perdana. All Rights Reserved.</p>
    </footer>
</body>
</html>
